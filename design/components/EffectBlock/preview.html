<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>EffectBlock — preview</title></head>
<body>
<div id="root" class="tk-demo tk-demo--top"></div>
<script>
  var T = window.Tank, h = React.createElement, useState = React.useState;
  ReactDOM.createRoot(document.getElementById("root")).render(h(React.Fragment, null,
    h(T.EffectBlock, { title: "REVERB", defaultEnabled: true }, h(T.Knob, { label: "RVB MIX", defaultValue: 24 }), h(T.Knob, { label: "RVB DECAY", defaultValue: 12 })),
    h(T.EffectBlock, { title: "DELAY", defaultEnabled: false }, h(T.Knob, { label: "DLY TIME", defaultValue: 38 }), h(T.Knob, { label: "DLY MIX", defaultValue: 20 })),
    h(T.EffectBlock, { title: "ENTRADA" }, h(T.Knob, { label: "IR CAB", size: "sm", min: 1, max: 8, defaultValue: 3 }), h(T.Knob, { label: "GATE", size: "sm", defaultValue: 0 }))));
</script>
</body>
</html>
