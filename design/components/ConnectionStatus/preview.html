<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>ConnectionStatus — preview</title></head>
<body>
<div id="root" class="tk-demo"></div>
<script>
  var T = window.Tank, h = React.createElement, useState = React.useState;
  ReactDOM.createRoot(document.getElementById("root")).render(h(React.Fragment, null,
    h(T.ConnectionStatus, { transport: "usb", state: "connected", device: "Tank-G", detail: "fw 1.2" }),
    h(T.ConnectionStatus, { transport: "ble", state: "connecting", device: "Tank-G BLE" }),
    h(T.ConnectionStatus, { transport: "usb", state: "disconnected" }),
    h(T.ConnectionStatus, { transport: "ble", state: "error", device: "Tank-G BLE", onClick: function () {} })));
</script>
</body>
</html>
