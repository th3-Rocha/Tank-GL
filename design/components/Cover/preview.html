<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Tank Studio</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:linear-gradient(180deg, var(--ground-top), var(--ground-bottom)); color:var(--ink); font-family:var(--font-sans); overflow:hidden; }
  .cover { position:relative; height:320px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:320px; overflow:hidden; }
  .art svg { display:block; }
  .amber { fill:var(--amber); }
  .ctrl { fill:var(--control); }
  .disp { fill:var(--display-bg); }
  .seg { fill:var(--display-on); filter:drop-shadow(0 0 4px var(--display-on)); }
  .chart { fill:var(--chartreuse); }
  .cut { fill:none; stroke:var(--on-amber); stroke-width:12; stroke-linecap:round; opacity:.35; }
  .cutv { fill:none; stroke:var(--on-amber); stroke-width:12; stroke-linecap:round; }
  .trk { fill:none; stroke:var(--surface); stroke-width:6; stroke-linecap:round; }
  .val { fill:none; stroke:var(--amber); stroke-width:6; stroke-linecap:round; filter:drop-shadow(0 0 4px var(--amber-glow)); }
  .bead { fill:var(--ink); }
  .words { position:absolute; left:var(--space-6); bottom:var(--space-6); max-width:440px; }
  .name { margin:0; font-family:var(--font-condensed); font-size:112px; line-height:.92; font-weight:700; letter-spacing:-.01em; color:var(--ink); }
  .tag { margin:var(--space-2) 0 0 4px; font-size:14px; line-height:20px; color:var(--ink-muted); }
</style>
</head>
<body>
<div class="cover">

  arrangement one tall amber slab with satellites, bottoms on one line space-4 above the edge, space-4 gutters
  pattern     knob arcs, from "o knob é o gesto principal" in the README: twelve 270° arcs at a space-16 pitch on the grey block, values lit in amber; one large arc cut into the slab in on-amber
  scales      sides in space-4 multiples; gutters space-4; pitch space-16; corners radius-md (blocks), radius-sm (display), radius-xs (colour chip), pills radius-pill
-->
