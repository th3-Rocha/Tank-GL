<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>Toggle — preview</title></head>
<body>
<div id="root" class="tk-demo tk-demo--panel" style="gap: var(--space-6)"></div>
<script>
  var T = window.Tank, h = React.createElement, useState = React.useState;
  ReactDOM.createRoot(document.getElementById("root")).render(h(React.Fragment, null,
    h(T.Toggle, { label: "Bypass", defaultChecked: false }),
    h(T.Toggle, { label: "Loopback", defaultChecked: true }),
    h(T.Toggle, { label: "Reverb", defaultChecked: true, showState: true }),
    h(T.Toggle, { label: "Delay", size: "sm", defaultChecked: false, showState: true }),
    h(T.Toggle, { label: "Modo show", disabled: true })));
</script>
</body>
</html>
